[settings]
minimum_release_age = "7d"
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64"]

[tools]
# Runs the git hooks in .pre-commit-config.yaml (ruff, YAML/JSON/TOML checks, whitespace).
pre-commit = "4.7.0"

[tasks.setup]
description = "Install the git pre-commit hooks"
run = "pre-commit install"

[tasks.lint]
description = "Run the pre-commit hooks on every file"
run = "pre-commit run --all-files"
